<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780"><rect width="1600" height="780" rx="28" fill="#0b1117"/><text x="80" y="72" fill="#f5f7f8" font-family="Arial" font-size="28" font-weight="700">Where behaviour changed the signal</text><text x="80" y="105" fill="#8ea2b1" font-family="Arial" font-size="15">The interface translates model output into an inspectable change rather than another opaque metric.</text><rect x="80" y="150" width="440" height="230" rx="16" fill="#17232c"/><text x="112" y="190" fill="#8ea2b1" font-family="Arial" font-size="14">STAGE 1 · TECHNICAL ONLY</text><text x="112" y="250" fill="#fff" font-family="Arial" font-size="52" font-weight="700">HOLD</text><text x="112" y="290" fill="#8ea2b1" font-family="Arial" font-size="16">Probability of DOWN</text><text x="112" y="340" fill="#fff" font-family="Arial" font-size="34" font-weight="700">54.2%</text><rect x="580" y="150" width="440" height="230" rx="16" fill="#17232c"/><text x="612" y="190" fill="#8ea2b1" font-family="Arial" font-size="14">STAGE 2 · + BEHAVIOURAL</text><text x="612" y="250" fill="#fff" font-family="Arial" font-size="52" font-weight="700">BUY</text><text x="612" y="290" fill="#8ea2b1" font-family="Arial" font-size="16">Probability of DOWN</text><text x="612" y="340" fill="#fff" font-family="Arial" font-size="34" font-weight="700">28.4%</text><rect x="1080" y="150" width="440" height="230" rx="16" fill="#dff6eb"/><text x="1112" y="190" fill="#087a55" font-family="Arial" font-size="14" font-weight="700">WHAT CHANGED?</text><text x="1112" y="255" fill="#073e5c" font-family="Arial" font-size="42" font-weight="700">−25.8 pts</text><text x="1112" y="292" fill="#476b78" font-family="Arial" font-size="16">down probability</text><text x="1112" y="335" fill="#073e5c" font-family="Arial" font-size="17">Direction changed from HOLD → BUY.</text><rect x="80" y="430" width="1440" height="250" rx="16" fill="#101820" stroke="#293743"/><text x="112" y="470" fill="#8ea2b1" font-family="Arial" font-size="14">WHAT INFLUENCED THIS SIGNAL?</text><rect x="112" y="515" width="620" height="18" rx="9" fill="#1ba7d8"/><rect x="112" y="555" width="450" height="18" rx="9" fill="#1ba7d8" opacity=".8"/><rect x="112" y="595" width="350" height="18" rx="9" fill="#1ba7d8" opacity=".62"/><text x="760" y="530" fill="#fff" font-family="Arial" font-size="17">MACD</text><text x="760" y="570" fill="#fff" font-family="Arial" font-size="17">RSI</text><text x="760" y="610" fill="#fff" font-family="Arial" font-size="17">VIX / sentiment context</text><text x="1120" y="530" fill="#8ea2b1" font-family="Arial" font-size="15">Technical features remained dominant.</text><text x="1120" y="565" fill="#8ea2b1" font-family="Arial" font-size="15">Behavioural data changed confidence</text><text x="1120" y="600" fill="#8ea2b1" font-family="Arial" font-size="15">without pretending to explain everything.</text></svg>