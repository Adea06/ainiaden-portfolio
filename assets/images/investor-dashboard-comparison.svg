<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700"><rect width="1600" height="700" fill="#f4f0e7"/><text x="80" y="75" fill="#151515" font-family="Arial" font-size="22" font-weight="700">FROM MULTI-PAGE ANALYSIS TO ONE COMPARISON VIEW</text><rect x="80" y="125" width="650" height="470" rx="18" fill="#fff" stroke="#d5d0c8"/><text x="115" y="170" fill="#777" font-family="Arial" font-size="16" font-weight="700">BEFORE · TECHNICAL PROTOTYPE</text><rect x="115" y="205" width="580" height="55" rx="8" fill="#edf0f2"/><rect x="115" y="285" width="270" height="180" rx="10" fill="#f5f7f8"/><rect x="410" y="285" width="285" height="180" rx="10" fill="#f5f7f8"/><rect x="115" y="490" width="580" height="55" rx="8" fill="#edf0f2"/><text x="115" y="575" fill="#6d685f" font-family="Arial" font-size="15">Pages separated evidence and made comparison slower.</text><rect x="870" y="125" width="650" height="470" rx="18" fill="#0b1117"/><text x="905" y="170" fill="#8ea2b1" font-family="Arial" font-size="16" font-weight="700">AFTER · ONE-PAGE INVESTOR COMPARISON</text><rect x="905" y="205" width="580" height="55" rx="8" fill="#17232c"/><rect x="905" y="285" width="275" height="145" rx="10" fill="#17232c"/><rect x="1210" y="285" width="275" height="145" rx="10" fill="#17232c"/><text x="935" y="320" fill="#8ea2b1" font-family="Arial" font-size="13">STAGE 1</text><text x="935" y="370" fill="#fff" font-family="Arial" font-size="34" font-weight="700">HOLD</text><text x="1240" y="320" fill="#8ea2b1" font-family="Arial" font-size="13">STAGE 2</text><text x="1240" y="370" fill="#fff" font-family="Arial" font-size="34" font-weight="700">BUY</text><rect x="905" y="455" width="580" height="90" rx="10" fill="#17232c"/><text x="935" y="492" fill="#8ea2b1" font-family="Arial" font-size="13">BEHAVIOURAL IMPACT</text><text x="935" y="525" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Direction, probability and context in one flow</text><text x="905" y="575" fill="#8ea2b1" font-family="Arial" font-size="15">The redesign makes the comparison the main task.</text></svg>